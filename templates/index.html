<!DOCTYPE html>
<html>
    <head>
        <title>WebRTC Sample</title>
        <meta charset="utf-8">
        <link href="{{.URL}}/css/site.css" rel="stylesheet" />
    </head>
    <body class="m-0 p-0 h[100vh] w[100vw]">
        <header class="flex flex-row items-center justify-around w-full h-16 bg-indigo-400 relative">
            <input type="text" id="user_name" placeholder="User Name">
            <div id="sample_message"></div>
            <textarea id="input_message"></textarea>
            <button onclick="Page.connect()">Connect</button>
            <button onclick="Page.send()">Send</button>
            <button onclick="Page.close()">Close</button>
            <select id="video_codec_selector"></select>
            <label for="force_video_codec_check">
                <input type="checkbox" id="force_video_codec_check">force
            </label>
            <div>
                <button id="connected-user-names-menu-input"
                    onclick="Page.switchUserList()"
                    class="bg-white hover:bg-blue-500 px-4 py-2 rounded-lg transition">
                    Users(<span id="connected-user-count">0</span>)
                </button>
                <div id="connected-user-dropdown" 
                    class="hidden absolute right-4 top-16 w-48 bg-white text-slate-800 shadow-xl border border-slate-200 rounded-md overflow-hidden z-50"
                >
                    <ul id="connected-user-list" class="py-2">
                    </ul>
                </div>
            </div>
        </header>
        
        <div id="received_text_area"></div>
        <div>
            <label for="local_video_usage">
                <input type="checkbox" id="local_video_usage">
                Use Local Video
            </label>
            <div>Local Video</div>
            <video id="local_video" muted>Video stream not available.</video>
            <div>Remote Videos</div>
            <div id="remote_track_area"></div>
        </div>
        <div>
            <div>DataChannel</div>
            <div>        
                <button onclick="Page.sendTextDataChannel()">Send Text</button>
            </div>
            <div id="received_datachannel_area"></div>
        </div>
        <script src="{{.URL}}/js/main.page.js"></script>
        <script>Page.init('{{.URL}}', '{{.ICEServerJSON}}');</script>
    </body>
</html>
